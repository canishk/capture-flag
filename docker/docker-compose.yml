services:
  postgres:
    image: postgres:16-alpine
    container_name: cipherforge-postgres
    environment:
      POSTGRES_USER: cipherforge
      POSTGRES_PASSWORD: cipherforge
      POSTGRES_DB: cipherforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cipherforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cipherforge-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cipherforge:cipherforge@postgres:5432/cipherforge
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - api-storage:/app/storage

volumes:
  postgres-data:
  redis-data:
  api-storage:
